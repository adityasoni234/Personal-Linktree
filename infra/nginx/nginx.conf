# Reverse proxy for IEEE SOU Link Hub.
#
# Responsibilities:
#   * terminate TLS and redirect all plaintext traffic;
#   * overwrite X-Forwarded-For so a client cannot spoof its IP past the
#     application's rate limiter;
#   * serve the built SPA and uploaded media with tight headers;
#   * provide a coarse edge rate limit in front of the application's own.

# Edge limits. The application enforces the real per-user/per-endpoint policy;
# these exist to shed obvious floods before they reach Python.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge must stay reachable over plaintext.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn conn_zone 40;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json;

    # ---- API -------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_headers.conf;
    }

    # Authentication endpoints get a tighter edge budget.
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_headers.conf;
    }

    location = /health { proxy_pass http://backend_upstream; access_log off; }
    location = /ready  { proxy_pass http://backend_upstream; access_log off; }

    # ---- Uploaded media --------------------------------------------------
    # Served straight from disk, never through the application. The sandbox CSP
    # and nosniff prevent an uploaded SVG from executing in this origin.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        # Never execute anything from the upload directory.
        location ~* \.(php|phtml|py|pl|sh|cgi|jsp|asp|aspx|html?|js)$ {
            return 404;
        }
        try_files $uri =404;
    }

    # ---- Frontend SPA ----------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/proxy_headers.conf;
    }
}
